name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew shadowJar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'latest' || format('preview-build-{0}', github.run_number) }}
          name: ${{ github.event_name == 'workflow_dispatch' && 'Latest' || format('Preview Build {0}', github.run_number) }}
          files: app/build/libs/*.jar
          generate_release_notes: true
          make_latest: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ github.event_name != 'workflow_dispatch' }}
